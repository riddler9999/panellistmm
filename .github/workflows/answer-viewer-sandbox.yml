name: Answer Viewer Sandbox Verification

on:
  pull_request:
    paths:
      - "apps/answer-viewer-sandbox/**"
      - ".github/workflows/answer-viewer-sandbox.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/answer-viewer-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/answer-viewer-sandbox/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Unit and behavioral tests
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright for verification
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/answer-viewer-vite.log 2>&1 &
          echo $! > /tmp/answer-viewer-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/answer/phr_sbx_a4f19c82d7e641b39a60c52e >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/answer-viewer-vite.log
          exit 1

      - name: Browser verification
        run: node scripts/verify-browser.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-viewer-browser-verification
          path: apps/answer-viewer-sandbox/browser-evidence
          if-no-files-found: ignore
